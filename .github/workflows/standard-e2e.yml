# The Biome Standard, proven end to end from an empty directory: biome init -> add every
# member -> CPM fetches each member from GitHub BY ITS RELEASED TAG (real network) -> build ->
# run a program exercising all five members -> RESULT: PASS. Network-dependent by design, so
# it is on-demand + post-release rather than in the offline pre-push gate.
name: standard-e2e
#
# DISARMED ON RELEASE — on demand only, deliberately.
#
# This job has never passed in CI: it failed on v1.11.4, v1.11.5 and v1.11.6. It ran on
# `release: [published]`, so every release mailed a failure for a check that gates nothing,
# and the noise trained everyone to ignore it. Removing that trigger is not hiding a
# regression — the release's real acceptance test is the LOCAL
# `scripts/test-standard-e2e.sh` (releasing.md step 7), which passes against the pushed tags.
#
# WHY IT FAILS, and what must be true before restoring `release: [published]`:
# cheatah-gpu-linalg discovers its GPU toolchain from a developer workstation — $VULKAN_SDK
# or ~/Tools/vulkan-sdk for headers, a GLOB into a sibling checkout's build/ for volk, and
# find_program for slangc. A consumer that fetched the members by tag through CPM — the exact
# flow this job exists to prove — has none of those, so it cannot configure. Its public
# headers also name VkBuffer/VkResult unconditionally, so consumers compile against Vulkan
# even when the backend was never provisioned.
#
# The fix belongs there: self-provision volk + Vulkan-Headers + slangc via FetchContent, the
# way cheatah-gpu/cmake/Vulkan.cmake already does. Do NOT paper over it by apt-installing a
# Vulkan SDK in this file — that hides the defect this job is supposed to surface.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: toolchain deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      # cheatah-gpu-linalg's kernels are Slang, and its CMakeLists FATAL_ERRORs when slangc is
      # absent — a bare runner has no Vulkan SDK, so the standard could never configure here.
      # slangc alone is enough: compiling .slang -> .spv/.metal is pure codegen and needs no GPU,
      # no driver and no SDK. Version pinned to match the one our engine's native build
      # script provisions; bump both together.
      - name: provision slangc (the shader toolchain)
        run: |
          SLANG_VER=2026.13.1
          curl -fsSL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VER}/slang-${SLANG_VER}-linux-x86_64.tar.gz" \
            | tar xz -C /opt
          /opt/bin/slangc -v || true
          echo /opt/bin >> "$GITHUB_PATH"
      - name: build biome
        run: |
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/release --target biome -j
      - name: the standard, end to end
        run: bash scripts/test-standard-e2e.sh build/release/bin/biome
